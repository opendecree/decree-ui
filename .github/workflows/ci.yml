# CI pipeline for the OpenDecree Admin GUI (React + Vite + Tailwind).
#
# Jobs: lint, typecheck, test, build → check (alls-green gate)
#       e2e (Playwright against Docker stack) also feeds into check
# The check job aggregates all results for branch protection.
#
# The first job defines YAML anchors (&checkout, &setup-node-22, &install)
# on its setup steps; subsequent jobs alias them to avoid repetition.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - &setup-node-22
        name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - &install
        name: Install dependencies
        run: npm ci
      - name: Run biome lint
        run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *setup-node-22
      - *install
      - name: Run tsc
        run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *setup-node-22
      - *install
      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        # codecov/codecov-action@v6.0.0
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          files: coverage/coverage-final.json
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *setup-node-22
      - *install
      - name: Build production bundle
        run: npm run build

  e2e:
    name: E2E (Playwright)
    needs: [lint, typecheck, test, build]
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *setup-node-22
      - *install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start stack
        run: docker compose -f e2e/docker-compose.yml up -d --build

      - name: Run Playwright tests
        run: npx playwright test
        env:
          BASE_URL: http://localhost:3000
          API_URL: http://localhost:8080
          CI: "true"

      - name: Stop stack
        if: always()
        run: docker compose -f e2e/docker-compose.yml down

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  check:
    name: CI check
    if: always()
    needs: [lint, typecheck, test, build, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
